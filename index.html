<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copa Mundial FIFA 2026 - Estadio Virtual</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Paleta Premium Cyber-Estadio */
            --bg-dark: #070a13;
            --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #020617 100%);
            --panel-bg: rgba(13, 20, 38, 0.65);
            --panel-border: rgba(99, 102, 241, 0.15);
            
            --grass-green: #024e37;
            --grass-light: #036245;
            --accent-neon: #00ffaa; 
            --cyan-glow: #06b6d4;
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;

            --gold: #f59e0b;
            --silver: #e2e8f0;
            --bronze: #f97316;
        }

        body {
            font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-gradient);
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1350px; 
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255,255,255,0.1);
            border: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .status-bar {
            background: rgba(4, 7, 15, 0.6);
            padding: 8px 16px;
            border-radius: 50px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-neon);
            border: 1px solid rgba(99, 102, 241, 0.2);
            display: inline-block;
            align-self: center;
        }

        .header-titles {
            text-align: center;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0 0 5px 0;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #a5b4fc, var(--accent-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* WORKSPACE RESPONSIVO (Por defecto móvil: todo en una sola columna hacia abajo) */
        .workspace {
            display: flex;
            flex-direction: column; 
            gap: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        /* CANCHA (Aspect-ratio 1 / 1.2 -> 20% más larga) */
        .football-pitch {
            width: 100%;
            aspect-ratio: 1 / 1.2; 
            height: auto; 
            background: 
                linear-gradient(rgba(2, 6, 23, 0.2) 0%, rgba(2, 6, 23, 0.6) 100%),
                linear-gradient(180deg, var(--grass-green) 50%, var(--grass-light) 50%);
            background-size: 100% 100%, 100% 7%;
            border-radius: 16px;
            border: 2.5px solid rgba(255, 255, 255, 0.8);
            position: relative;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 12px 28px rgba(0,0,0,0.6);
            overflow: hidden;
            display: none;
            box-sizing: border-box;
        }

        .pitch-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        .pitch-lines::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.4);
        }
        .pitch-lines::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20%;
            aspect-ratio: 1 / 1;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .pitch-area-top, .pitch-area-bot {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 38%;
            height: 10%;
            border-left: 2px solid rgba(255,255,255,0.35);
            border-right: 2px solid rgba(255,255,255,0.35);
        }
        .pitch-area-top { top: 0; border-bottom: 2px solid rgba(255,255,255,0.35); }
        .pitch-area-bot { bottom: 0; border-top: 2px solid rgba(255,255,255,0.35); }

        /* EFECTO DE FLOTACIÓN SUTIL (BREATHING) */
        @keyframes flotacionBreathing {
            0% { transform: translate(-50%, -53%); }
            50% { transform: translate(-50%, -47%); }
            100% { transform: translate(-50%, -53%); }
        }

        .player-node {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 14%; 
            animation: flotacionBreathing 4.5s ease-in-out infinite;
        }

        .player-node:nth-child(odd) { animation-delay: 0.6s; animation-duration: 4.8s; }
        .player-node:nth-child(3n) { animation-delay: 1.3s; animation-duration: 4.2s; }

        .avatar {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            border: 2px solid var(--accent-neon);
            box-shadow: 0 6px 14px rgba(0,0,0,0.6);
            position: relative;
            color: #fff;
            overflow: hidden;
            font-size: 4.5vw; 
            transition: scale 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .player-node:hover .avatar {
            scale: 1.15;
            border-color: #ffffff;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 255, 170, 0.4);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }

        .player-info {
            background: #030712;
            padding: 3px 6px;
            border-radius: 6px;
            margin-top: 4px;
            font-size: 1.8vw; 
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.15);
            white-space: nowrap;
            box-shadow: 0 5px 12px rgba(0,0,0,0.7);
            text-align: center;
            color: #ffffff;
            width: fit-content;
        }
        
        .player-score {
            color: var(--accent-neon);
            font-size: 0.9em;
            font-weight: 800;
            display: block;
            margin-top: 1px;
        }

        /* Estilos de podio */
        .p-pos-1 .avatar { background: linear-gradient(135deg, #fbbf24, #d97706); border-color: #fff3c4; box-shadow: 0 0 15px rgba(251, 191, 36, 0.5); scale: 1.06; }
        .p-pos-1 .player-info { border-color: var(--gold); } 
        .p-pos-1 .player-score { color: #fef08a; }
        .p-pos-2 .avatar { background: linear-gradient(135deg, #f1f5f9, #64748b); border-color: #ffffff; box-shadow: 0 0 12px rgba(255,255,255,0.3); scale: 1.06; }
        .p-pos-2 .player-info { border-color: var(--silver); }
        .p-pos-3 .avatar { background: linear-gradient(135deg, #ea580c, #9a3412); border-color: #ffedd5; box-shadow: 0 0 10px rgba(234, 88, 12, 0.4); scale: 1.04; }
        .p-pos-3 .player-info { border-color: var(--bronze); }
        .p-normal .avatar { background: linear-gradient(135deg, #1d4ed8, #0b1329); border-color: rgba(0, 255, 170, 0.7); }

        /* BANCA DE RESERVAS */
        .bench-section {
            width: 100%; 
            background: rgba(7, 11, 22, 0.5);
            border-radius: 18px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.06);
            box-sizing: border-box;
            display: none;
        }

        .bench-title {
            font-size: 18px; 
            font-weight: 800; letter-spacing: 0.5px;
            color: #a5b4fc; text-transform: uppercase; margin-bottom: 15px;
            display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px;
        }

        /* Diseño base móvil por defecto: 1 columna limpia y espaciosa para soportar el +30% */
        .bench-vertical-list { 
            display: grid;
            grid-template-columns: 1fr; 
            gap: 12px; 
            width: 100%;
        }

        /* ELEMENTOS DE LA BANCA (+30% Optimizado y Responsivo) */
        .bench-player {
            background: rgba(30, 41, 59, 0.4); 
            padding: 14px 16px; 
            border-radius: 14px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2); 
            border: 1px solid rgba(255,255,255,0.03);
            display: flex; 
            align-items: center; 
            gap: 15px; 
            transition: all 0.25s;
            box-sizing: border-box;
            width: 100%;
        }
        .bench-player:hover { background: rgba(30, 41, 59, 0.7); border-color: var(--accent-neon); }

        .bench-avatar-frame {
            width: 48px;  
            height: 48px; 
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.25);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.4);
            flex-shrink: 0;
            font-size: 18px; 
        }
        .bench-avatar-frame img { width: 100%; height: 100%; object-fit: cover; }

        .bench-pos {
            background: rgba(0, 0, 0, 0.4); 
            width: 48px;  
            height: 48px; 
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; 
            font-weight: 800; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
        }

        .bench-info-container {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
        }

        .bench-info-name { 
            color: #fff; 
            font-weight: 700; 
            font-size: 18px; 
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis; 
        }
        
        .bench-score { 
            color: var(--accent-neon); 
            font-weight: 800; 
            font-size: 16px; 
            margin-top: 2px; 
        }

        .empty-state { padding: 40px; color: var(--text-muted); font-style: italic; text-align: center; width: 100%; }

        /* ==========================================================================
           1. MEDIA QUERY PARA TABLETS (Pantallas medianas - desde 650px)
           ========================================================================== */
        @media (min-width: 650px) {
            body { padding: 20px; }
            .main-wrapper { padding: 25px; }
            h2 { font-size: 30px; }
            
            /* En tablets, la banca se ve mejor distribuida en 2 columnas */
            .bench-vertical-list {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
            
            /* Subimos levemente los tamaños de la banca */
            .bench-player { padding: 15px 18px; gap: 16px; }
            .bench-avatar-frame, .bench-pos { width: 52px; height: 52px; font-size: 20px; }
            .bench-info-name { font-size: 20px; }
            .bench-score { font-size: 18px; }
        }

        /* ==========================================================================
           2. MEDIA QUERY PARA NOTEBOOKS / PC (Pantallas grandes - desde 992px)
           ========================================================================== */
        @media (min-width: 992px) {
            body { padding: 30px; }
            .main-wrapper { padding: 35px; }
            h2 { font-size: 36px; }
            
            /* Activamos el diseño lado a lado (Cancha izquierda / Banca derecha) */
            .workspace {
                flex-direction: row;
                align-items: flex-start;
                justify-content: space-between;
                gap: 25px;
            }
            
            /* Ajustamos los anchos fijos de la estructura en PC */
            .football-pitch {
                display: block;
                flex: 0 0 58%;
                max-width: 730px;
            }

            .bench-section {
                display: block;
                flex: 0 0 40%;
                align-self: stretch; 
            }

            /* Volvemos a lista continua de 1 sola columna en el panel derecho */
            .bench-vertical-list {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            /* Valores definitivos con el 30% de aumento optimizados para PC */
            .bench-player { padding: 16px 20px; gap: 18px; }
            .bench-avatar-frame { width: 58px; height: 58px; font-size: 22px; }
            .bench-pos { width: 58px; height: 58px; font-size: 20px; }
            .bench-info-name { font-size: 21px; }
            .bench-score { font-size: 19px; }

            /* Fijamos los tamaños de los textos y avatares fijos de los titulares en la cancha */
            .avatar { font-size: 26px; }
            .p-pos-1 .avatar { font-size: 36px; width: 100px; height: 100px; } 
            .p-pos-2 .avatar { font-size: 32px; width: 92px; height: 92px; }
            .p-pos-3 .avatar { font-size: 28px; width: 85px; height: 85px; }
            .p-normal .avatar { width: 74px; height: 74px; }
            
            .player-node { width: auto; }
            .player-info { font-size: 13px; min-width: 105px; padding: 3px 6px; }
            .p-pos-1 .player-info { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div id="status-bar" class="status-bar">
            <i class="fa-solid fa-satellite-dish fa-bounce"></i> Conectando con los servidores de Google Sheets...
        </div>

        <div class="header-titles">
            <h2>Mundial FIFA 2026</h2>
        </div>

        <div id="mensaje-inicio" class="empty-state">
            <i class="fa-solid fa-sync fa-spin" style="font-size: 36px; color: #818cf8; margin-bottom: 15px; display:block;"></i>
            Sincronizando posiciones del estadio virtual en tiempo real...
        </div>

        <div class="workspace">
            <div class="football-pitch" id="cancha">
                <div class="pitch-lines"></div>
                <div class="pitch-area-top"></div>
                <div class="pitch-area-bot"></div>
            </div>

            <div class="bench-section" id="banca-contenedor">
                <div class="bench-title"><i class="fa-solid fa-couch"></i> A la banca 😆</div>
                <div class="bench-vertical-list" id="banca-cuerpo"></div>
            </div>
        </div>
    </div>

    <script>
        // Enlace público de tu Google Sheets (Formato CSV seguro)
        const BASE_URL_SHEETS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRaSkZcOTooQwbmjreBN7WVtD5_s_PEJ1N8DOp5s0unXosIbvTRXGimFjKjHAHybcJZllDjiq-_zi0Q/pub?output=csv";

        const cancha = document.getElementById('cancha');
        const bancaContenedor = document.getElementById('banca-contenedor');
        const bancaCuerpo = document.getElementById('banca-cuerpo');
        const mensajeInicio = document.getElementById('mensaje-inicio');
        const statusBar = document.getElementById('status-bar');

        window.addEventListener('DOMContentLoaded', cargarDatosDesdeNube);

        function cargarDatosDesdeNube() {
            // Se inyecta un timestamp dinámico para obligar a Google a entregar datos frescos sin caché local
            const urlConRompeCache = `${BASE_URL_SHEETS}&cachebuster=${new Date().getTime()}`;

            fetch(urlConRompeCache)
                .then(response => {
                    if (!response.ok) throw new Error("No se pudo conectar a la base de datos.");
                    return response.text();
                })
                .then(csvTexto => {
                    procesarCSV(csvTexto);
                    statusBar.innerHTML = `<i class="fa-solid fa-circle-check"></i> Estadio sincronizado en vivo`;
                    statusBar.style.color = "var(--accent-neon)";
                })
                .catch(error => {
                    console.error(error);
                    statusBar.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> Error al conectar con Google Sheets.`;
                    statusBar.style.color = "#ef4444";
                });
        }

        function procesarCSV(texto) {
            const filasRaw = texto.split(/\r?\n/);
            const filas = filasRaw.map(f => f.split(','));

            if (filas.length < 2) return;

            const listaJugadores = [];
            let colLugar = 0, colNombre = 1, colPuntaje = 2, colFoto = -1;

            // Mapeo dinámico e inteligente de columnas según las cabeceras de tu Sheet
            if(filas[0]) {
                filas[0].forEach((celda, idx) => {
                    const txt = String(celda).toLowerCase().trim();
                    if(txt.includes("lug") || txt.includes("pos")) colLugar = idx;
                    if(txt.includes("nom") || txt.includes("int")) colNombre = idx;
                    if(txt.includes("pun") || txt.includes("mar")) colPuntaje = idx;
                    if(txt.includes("fot") || txt.includes("url") || txt.includes("img")) colFoto = idx;
                });
            }

            for (let i = 1; i < filas.length; i++) {
                const fila = filas[i];
                if (!fila || fila.length < 2 || !fila[colNombre]) continue;

                const pRaw = fila[colPuntaje];
                const puntosNum = pRaw !== undefined ? parseFloat(pRaw) : 0;
                
                let urlFoto = "";
                if(colFoto !== -1 && fila[colFoto]) {
                    urlFoto = fila[colFoto].replace(/^"|"$/g, '').trim();
                }

                listaJugadores.push({
                    posOriginal: parseInt(fila[colLugar]) || (listaJugadores.length + 1),
                    nombre: fila[colNombre].replace(/^"|"$/g, '').trim(),
                    puntos: puntosNum,
                    foto: urlFoto
                });
            }

            // Ordenación automática por rendimiento estricto de mayor a menor puntuación
            listaJugadores.sort((a, b) => b.puntos - a.puntos);

            // Cálculo dinámico de posiciones considerando empates matemáticos reales
            let rangoActual = 1;
            listaJugadores.forEach((jugador, index) => {
                if (index > 0 && jugador.puntos < listaJugadores[index - 1].puntos) {
                    rangoActual = index + 1;
                }
                jugador.posCalculada = rangoActual;
            });

            renderizarEstadioFijo(listaJugadores);
        }

        function obtenerContenidoAvatar(lugar) {
            if (lugar === 1) return "👑";
            if (lugar === 2) return "🥈";
            if (lugar === 3) return "🥉";
            if (lugar <= 11) return "⚽";
            return "🏃‍♂️";
        }

        function renderizarEstadioFijo(jugadores) {
            cancha.querySelectorAll('.player-node').forEach(el => el.remove());
            bancaCuerpo.innerHTML = "";

            mensajeInicio.style.display = "none";
            cancha.style.display = "block";
            bancaContenedor.style.display = "block";

            const titulares = jugadores.slice(0, 11);
            const suplentes = jugadores.slice(11);

            // Coordenadas calculadas al milímetro para soportar el aspect-ratio 1/1.2 de la cancha
            const mapaTactico = [
                { x: 50, y: 90 }, { x: 84, y: 76 }, { x: 61, y: 76 }, { x: 39, y: 76 }, { x: 16, y: 76 },
                { x: 76, y: 56 }, { x: 50, y: 56 }, { x: 24, y: 56 }, { x: 70, y: 32 }, { x: 30, y: 32 }, { x: 50, y: 14 }
            ];

            titulares.forEach((item, index) => {
                const coordenadas = mapaTactico[10 - index];
                if (!coordenadas) return;

                const divJugador = document.createElement('div');
                divJugador.classList.add('player-node');
                
                if (item.posCalculada === 1) divJugador.classList.add('p-pos-1');
                else if (item.posCalculada === 2) divJugador.classList.add('p-pos-2');
                else if (item.posCalculada === 3) divJugador.classList.add('p-pos-3');
                else divJugador.classList.add('p-normal');

                divJugador.style.left = `${coordenadas.x}%`;
                divJugador.style.top = `${coordenadas.y}%`;

                const avatarContenido = item.foto !== "" 
                    ? `<img src="${item.foto}" alt="${item.nombre}">` 
                    : obtenerContenidoAvatar(item.posCalculada);

                divJugador.innerHTML = `
                    <div class="avatar">${avatarContenido}</div>
                    <div class="player-info">
                        <strong>${item.posCalculada}. ${item.nombre}</strong>
                        <span class="player-score">${item.puntos} PTS</span>
                    </div>
                `;
                cancha.appendChild(divJugador);
            });

            suplentes.forEach(item => {
                const divSuplente = document.createElement('div');
                divSuplente.classList.add('bench-player');
                
                const avatarContenidoSuplente = item.foto !== "" 
                    ? `<img src="${item.foto}" alt="${item.nombre}">` 
                    : obtenerContenidoAvatar(item.posCalculada);

                divSuplente.innerHTML = `
                    <div class="bench-pos">${item.posCalculada}</div>
                    <div class="bench-avatar-frame">${avatarContenidoSuplente}</div>
                    <div class="bench-info-container">
                        <span class="bench-info-name">${item.nombre}</span>
                        <div class="bench-score">${item.puntos} pts</div>
                    </div>
                `;
                bancaCuerpo.appendChild(divSuplente);
            });
        }
    </script>
</body>
</html>
