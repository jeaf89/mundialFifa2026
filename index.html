<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copa Mundial FIFA 2026 - Estadio Virtual</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Paleta de Colores Oficial FIFA World Cup 2026 */
            --fifa-dark-bg: #0b0e14;
            --fifa-pitch-dark: #004d3c;  /* Verde Esmeralda Oficial */
            --fifa-pitch-light: #00664f;
            --fifa-lime: #ccff00;       /* Verde Fluorescente / Lima de la marca */
            --fifa-purple: #4a154b;     /* Púrpura de acento */
            --fifa-coral: #ff4a5a;      /* Coral vibrante de la identidad visual */
            
            --bg-gradient: linear-gradient(135deg, #0b0e14 0%, #161c27 100%);
            --panel-bg: rgba(18, 24, 38, 0.75);
            --panel-border: rgba(204, 255, 0, 0.15);
            
            --text-main: #ffffff;
            --text-muted: #94a3b8;

            --gold: #f59e0b;
            --silver: #cbd5e1;
            --bronze: #ea580c;
        }

        body {
            font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-gradient);
            background-color: var(--fifa-dark-bg);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
        }

        /* Iluminación ambiental inspirada en los estadios de EE. UU., México y Canadá 2026 */
        body::before {
            content: '';
            position: fixed;
            top: -10%; left: -10%; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(204, 255, 0, 0.08) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -10%; right: -10%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(255, 74, 90, 0.06) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1350px; 
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255,255,255,0.05);
            border: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .status-bar {
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 50px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--fifa-lime);
            border: 1px solid rgba(204, 255, 0, 0.3);
            display: inline-block;
            align-self: center;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .header-titles {
            text-align: center;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0 0 5px 0;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #ffffff, var(--fifa-lime), var(--fifa-coral));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .update-timestamp {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .update-timestamp i {
            color: var(--fifa-lime);
            margin-right: 4px;
        }

        .workspace {
            display: flex;
            flex-direction: column; 
            gap: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        /* CANCHA */
        .football-pitch {
            width: 100%;
            aspect-ratio: 1 / 1.2; 
            height: auto; 
            background: 
                linear-gradient(rgba(11, 14, 20, 0.15) 0%, rgba(11, 14, 20, 0.55) 100%),
                repeating-linear-gradient(90deg, var(--fifa-pitch-dark), var(--fifa-pitch-dark) 6%, var(--fifa-pitch-light) 6%, var(--fifa-pitch-light) 12%);
            border-radius: 16px;
            border: 2.5px solid rgba(255, 255, 255, 0.9);
            position: relative;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.85), 0 15px 35px rgba(0,0,0,0.6);
            overflow: hidden;
            display: none;
            box-sizing: border-box;
        }

        /* Arcos de Tiro de Esquina */
        .football-pitch::before {
            content: ''; position: absolute; top: 0; left: 0; width: 14px; height: 14px;
            border-bottom: 2px solid rgba(255,255,255,0.5); border-right: 2px solid rgba(255,255,255,0.5); border-radius: 0 0 100% 0; pointer-events: none;
        }
        .football-pitch::after {
            content: ''; position: absolute; top: 0; right: 0; width: 14px; height: 14px;
            border-bottom: 2px solid rgba(255,255,255,0.5); border-left: 2px solid rgba(255,255,255,0.5); border-radius: 0 0 0 100%; pointer-events: none;
        }

        .pitch-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        .pitch-lines::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.5);
        }
        .pitch-lines::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20%;
            aspect-ratio: 1 / 1;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .pitch-area-top, .pitch-area-bot {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 38%;
            height: 10%;
            border-left: 2px solid rgba(255,255,255,0.4);
            border-right: 2px solid rgba(255,255,255,0.4);
        }
        .pitch-area-top { top: 0; border-bottom: 2px solid rgba(255,255,255,0.4); }
        .pitch-area-bot { bottom: 0; border-top: 2px solid rgba(255,255,255,0.4); }

        /* Estilo Dinámico de la Pelota en Movimiento */
        .world-cup-ball {
            position: absolute;
            width: 24px;
            height: 24px;
            background: #ffffff;
            color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            z-index: 50;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.9), 0 0 12px var(--fifa-lime);
            transition: transform 0.05s linear;
        }

        /* ANIMACIÓN FLOTACIÓN */
        @keyframes flotacionBreathing {
            0% { transform: translate(-50%, -52%); }
            50% { transform: translate(-50%, -48%); }
            100% { transform: translate(-50%, -52%); }
        }

        .player-node {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 14%; 
            animation: flotacionBreathing 4.2s ease-in-out infinite;
        }

        .player-node:nth-child(odd) { animation-delay: 0.5s; animation-duration: 4.5s; }
        .player-node:nth-child(3n) { animation-delay: 1.1s; animation-duration: 3.9s; }

        .avatar {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111622;
            border: 2px solid var(--fifa-lime);
            box-shadow: 0 6px 14px rgba(0,0,0,0.6);
            position: relative;
            color: #fff;
            overflow: hidden;
            font-size: 4.5vw; 
            transition: scale 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .player-node:hover .avatar {
            scale: 1.15;
            border-color: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(204, 255, 0, 0.6);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }

        .player-info {
            background: #090d14;
            padding: 4px 8px;
            border-radius: 6px;
            margin-top: 5px;
            font-size: 1.8vw; 
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.12);
            white-space: nowrap;
            box-shadow: 0 5px 12px rgba(0,0,0,0.7);
            text-align: center;
            color: #ffffff;
            width: fit-content;
        }
        
        .player-score {
            color: var(--fifa-lime);
            font-size: 0.9em;
            font-weight: 800;
            display: block;
            margin-top: 1px;
        }

        .p-pos-1 .avatar { background: linear-gradient(135deg, #fbbf24, #d97706); border-color: #ffe399; box-shadow: 0 0 18px rgba(251, 191, 36, 0.4); scale: 1.06; }
        .p-pos-1 .player-info { border-color: var(--gold); } 
        .p-pos-1 .player-score { color: #fef08a; }
        
        .p-pos-2 .avatar { background: linear-gradient(135deg, #f1f5f9, #475569); border-color: #ffffff; box-shadow: 0 0 14px rgba(255,255,255,0.25); scale: 1.06; }
        .p-pos-2 .player-info { border-color: var(--silver); }
        .p-pos-2 .player-score { color: #e2e8f0; }
        
        .p-pos-3 .avatar { background: linear-gradient(135deg, #ea580c, #7c2d12); border-color: #ffccb3; box-shadow: 0 0 12px rgba(234, 88, 12, 0.3); scale: 1.04; }
        .p-pos-3 .player-info { border-color: var(--bronze); }
        .p-pos-3 .player-score { color: #ffedd5; }
        
        .p-normal .avatar { background: linear-gradient(135deg, #0055ff, #050b14); border-color: rgba(204, 255, 0, 0.7); }

        /* BANCA DE RESERVAS */
        .bench-section {
            width: 100%; 
            background: rgba(13, 18, 28, 0.6);
            border-radius: 18px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.05);
            box-sizing: border-box;
            display: none;
        }

        .bench-title {
            font-size: 18px; 
            font-weight: 800; letter-spacing: 0.5px;
            color: #cbd5e1; text-transform: uppercase; margin-bottom: 15px;
            display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px;
        }
        .bench-title i { color: var(--fifa-coral); }

        .bench-vertical-list { 
            display: grid;
            grid-template-columns: 1fr; 
            gap: 12px; 
            width: 100%;
        }

        .bench-player {
            background: rgba(26, 34, 50, 0.4); 
            padding: 14px 16px; 
            border-radius: 14px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2); 
            border: 1px solid rgba(255,255,255,0.04);
            display: flex; 
            align-items: center; 
            gap: 15px; 
            transition: all 0.25s ease;
            box-sizing: border-box;
            width: 100%;
        }
        .bench-player:hover { background: rgba(30, 41, 59, 0.6); border-color: var(--fifa-lime); transform: translateX(3px); }

        .bench-avatar-frame {
            width: 48px;  
            height: 48px; 
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.3);
            flex-shrink: 0;
            font-size: 18px; 
        }
        .bench-avatar-frame img { width: 100%; height: 100%; object-fit: cover; }

        .bench-pos {
            background: rgba(0, 0, 0, 0.4); 
            width: 48px;  
            height: 48px; 
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; 
            font-weight: 800; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }

        .bench-info-container {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
        }

        .bench-info-name { 
            color: #ffffff; 
            font-weight: 700; 
            font-size: 18px; 
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis; 
        }
        
        .bench-score { 
            color: var(--fifa-lime); 
            font-weight: 800; 
            font-size: 16px; 
            margin-top: 2px; 
        }

        .empty-state { padding: 40px; color: var(--text-muted); font-style: italic; text-align: center; width: 100%; }

        /* RESPONSIVO: TABLETS */
        @media (min-width: 650px) {
            body { padding: 20px; }
            .main-wrapper { padding: 25px; }
            h2 { font-size: 30px; }
            
            .bench-vertical-list {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
            .bench-player { padding: 15px 18px; gap: 16px; }
            .bench-avatar-frame, .bench-pos { width: 52px; height: 52px; font-size: 20px; }
            .bench-info-name { font-size: 20px; }
            .bench-score { font-size: 18px; }
        }

        /* RESPONSIVO: NOTEBOOKS / PC */
        @media (min-width: 992px) {
            body { padding: 30px; }
            .main-wrapper { padding: 35px; }
            h2 { font-size: 36px; }
            
            .workspace {
                flex-direction: row;
                align-items: flex-start;
                justify-content: space-between;
                gap: 25px;
            }
            .football-pitch { display: block; flex: 0 0 58%; max-width: 730px; }
            .bench-section { display: block; flex: 0 0 40%; align-self: stretch; }
            .bench-vertical-list { grid-template-columns: 1fr; gap: 14px; }

            .bench-player { padding: 16px 20px; gap: 18px; }
            .bench-avatar-frame { width: 58px; height: 58px; font-size: 22px; }
            .bench-pos { width: 58px; height: 58px; font-size: 20px; }
            .bench-info-name { font-size: 21px; }
            .bench-score { font-size: 19px; }

            .avatar { font-size: 26px; }
            .p-pos-1 .avatar { font-size: 36px; width: 100px; height: 100px; } 
            .p-pos-2 .avatar { font-size: 32px; width: 92px; height: 92px; }
            .p-pos-3 .avatar { font-size: 28px; width: 85px; height: 85px; }
            .p-normal .avatar { width: 74px; height: 74px; }
            
            .player-node { width: auto; }
            .player-info { font-size: 13px; min-width: 105px; padding: 4px 8px; }
            .p-pos-1 .player-info { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div id="status-bar" class="status-bar">
            <i class="fa-solid fa-satellite-dish fa-bounce"></i> Conectando con los servidores de Google Sheets...
        </div>

        <div class="header-titles">
            <h2>Mundial FIFA 2026</h2>
            <div id="fecha-actualizacion" class="update-timestamp"></div>
        </div>

        <div id="mensaje-inicio" class="empty-state">
            <i class="fa-solid fa-sync fa-spin" style="font-size: 36px; color: #ccff00; margin-bottom: 15px; display:block;"></i>
            Sincronizando posiciones del estadio virtual en tiempo real...
        </div>

        <div class="workspace">
            <div class="football-pitch" id="cancha">
                <div class="pitch-lines"></div>
                <div class="pitch-area-top"></div>
                <div class="pitch-area-bot"></div>
            </div>

            <div class="bench-section" id="banca-contenedor">
                <div class="bench-title"><i class="fa-solid fa-couch"></i> A la banca 😆</div>
                <div class="bench-vertical-list" id="banca-cuerpo"></div>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL_SHEETS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRaSkZcOTooQwbmjreBN7WVtD5_s_PEJ1N8DOp5s0unXosIbvTRXGimFjKjHAHybcJZllDjiq-_zi0Q/pub?output=csv";

        const cancha = document.getElementById('cancha');
        const bancaContenedor = document.getElementById('banca-contenedor');
        const bancaCuerpo = document.getElementById('banca-cuerpo');
        const mensajeInicio = document.getElementById('mensaje-inicio');
        const statusBar = document.getElementById('status-bar');
        const fechaActualizacion = document.getElementById('fecha-actualizacion');

        // Variables Globales para el comportamiento del Balón
        let pelotaElemento = null;
        let jugadaInterval = null;
        let nodosPodio = []; 
        let indiceAvatarActual = 0; 

        window.addEventListener('DOMContentLoaded', cargarDatosDesdeNube);

        function cargarDatosDesdeNube() {
            const urlConRompeCache = `${BASE_URL_SHEETS}&cachebuster=${new Date().getTime()}`;

            fetch(urlConRompeCache)
                .then(response => {
                    if (!response.ok) throw new Error("No se pudo conectar a la base de datos.");
                    return response.text();
                })
                .then(csvTexto => {
                    procesarCSV(csvTexto);
                    statusBar.innerHTML = `<i class="fa-solid fa-circle-check"></i> Estadio sincronizado en vivo`;
                    statusBar.style.color = "var(--fifa-lime)";
                })
                .catch(error => {
                    console.error(error);
                    statusBar.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> Error al conectar con Google Sheets.`;
                    statusBar.style.color = "var(--fifa-coral)";
                });
        }

        function procesarCSV(texto) {
            const filasRaw = texto.split(/\r?\n/);
            const filas = filasRaw.map(f => f.split(','));

            if (filas.length < 2) return;

            const listaJugadores = [];
            let colLugar = 0, colNombre = 1, colPuntaje = 2, colFoto = -1;

            if(filas[0]) {
                filas[0].forEach((celda, idx) => {
                    const txt = String(celda).toLowerCase().trim();
                    if(txt.includes("lug") || txt.includes("pos")) colLugar = idx;
                    if(txt.includes("nom") || txt.includes("int")) colNombre = idx;
                    if(txt.includes("pun") || txt.includes("mar")) colPuntaje = idx;
                    if(txt.includes("fot") || txt.includes("url") || txt.includes("img")) colFoto = idx;
                });
            }

            for (let i = 1; i < filas.length; i++) {
                const fila = filas[i];
                if (!fila || fila.length < 2 || !fila[colNombre]) continue;

                const pRaw = fila[colPuntaje];
                const puntosNum = pRaw !== undefined ? parseFloat(pRaw) : 0;
                
                let urlFoto = "";
                if(colFoto !== -1 && fila[colFoto]) {
                    urlFoto = fila[colFoto].replace(/^"|"$/g, '').trim();
                }

                listaJugadores.push({
                    posOriginal: parseInt(fila[colLugar]) || (listaJugadores.length + 1),
                    nombre: fila[colNombre].replace(/^"|"$/g, '').trim(),
                    puntos: puntosNum,
                    foto: urlFoto
                });
            }

            listaJugadores.sort((a, b) => b.puntos - a.puntos);

            let rangoConsecutivo = 1;
            listaJugadores.forEach((jugador, index) => {
                if (index > 0) {
                    if (jugador.puntos < listaJugadores[index - 1].puntos) {
                        rangoConsecutivo++;
                    }
                }
                jugador.posCalculada = rangoConsecutivo;
            });

            const stringDatosActuales = JSON.stringify(listaJugadores);
            const datosPrevios = localStorage.getItem('fifa_datos_previos');
            let timestampMuestreo = localStorage.getItem('fifa_ultimo_timestamp');

            if (stringDatosActuales !== datosPrevios) {
                const ahora = new Date();
                const opciones = { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
                timestampMuestreo = ahora.toLocaleDateString('es-ES', opciones);
                
                localStorage.setItem('fifa_datos_previos', stringDatosActuales);
                localStorage.setItem('fifa_ultimo_timestamp', timestampMuestreo);
            }

            if (timestampMuestreo) {
                fechaActualizacion.innerHTML = `<i class="fa-regular fa-clock"></i> Último cambio: ${timestampMuestreo}`;
            }

            renderizarEstadioFijo(listaJugadores);
        }

        function obtenerContenidoAvatar(lugar) {
            if (lugar === 1) return "👑";
            if (lugar === 2) return "🥈";
            if (lugar === 3) return "🥉";
            if (lugar <= 11) return "⚽";
            return "🏃‍♂️";
        }

        function renderizarEstadioFijo(jugadores) {
            // Detener cualquier animación previa del balón para evitar duplicados
            if(jugadaInterval) clearInterval(jugadaInterval);
            if(pelotaElemento) pelotaElemento.remove();

            cancha.querySelectorAll('.player-node').forEach(el => el.remove());
            bancaCuerpo.innerHTML = "";

            mensajeInicio.style.display = "none";
            cancha.style.display = "block";
            bancaContenedor.style.display = "block";

            const titulares = jugadores.slice(0, 11);
            const suplentes = jugadores.slice(11);

            const mapaTactico = [
                { x: 50, y: 90 }, { x: 84, y: 76 }, { x: 61, y: 76 }, { x: 39, y: 76 }, { x: 16, y: 76 },
                { x: 76, y: 56 }, { x: 50, y: 56 }, { x: 24, y: 56 }, { x: 70, y: 32 }, { x: 30, y: 32 }, { x: 50, y: 14 }
            ];

            nodosPodio = []; // Limpiamos referencias de los avatares del podio

            titulares.forEach((item, index) => {
                const coordenadas = mapaTactico[10 - index];
                if (!coordenadas) return;

                const divJugador = document.createElement('div');
                divJugador.classList.add('player-node');
                
                if (item.posCalculada === 1) divJugador.classList.add('p-pos-1');
                else if (item.posCalculada === 2) divJugador.classList.add('p-pos-2');
                else if (item.posCalculada === 3) divJugador.classList.add('p-pos-3');
                else divJugador.classList.add('p-normal');

                divJugador.style.left = `${coordenadas.x}%`;
                divJugador.style.top = `${coordenadas.y}%`;

                const avatarContenido = item.foto !== "" 
                    ? `<img src="${item.foto}" alt="${item.nombre}">` 
                    : obtenerContenidoAvatar(item.posCalculada);

                divJugador.innerHTML = `
                    <div class="avatar">${avatarContenido}</div>
                    <div class="player-info">
                        <strong>${item.posCalculada}. ${item.nombre}</strong>
                        <span class="player-score">${item.puntos} PTS</span>
                    </div>
                `;
                cancha.appendChild(divJugador);

                // Guardamos el nodo si pertenece a los primeros 3 puestos calculados
                if(item.posCalculada <= 3) {
                    nodosPodio.push(divJugador);
                }
            });

            suplentes.forEach(item => {
                const divSuplente = document.createElement('div');
                divSuplente.classList.add('bench-player');
                
                const avatarContenidoSuplente = item.foto !== "" 
                    ? `<img src="${item.foto}" alt="${item.nombre}">` 
                    : obtenerContenidoAvatar(item.posCalculada);

                divSuplente.innerHTML = `
                    <div class="bench-pos">${item.posCalculada}</div>
                    <div class="bench-avatar-frame">${avatarContenidoSuplente}</div>
                    <div class="bench-info-container">
                        <span class="bench-info-name">${item.nombre}</span>
                        <div class="bench-score">${item.puntos} pts</div>
                    </div>
                `;
                bancaCuerpo.appendChild(divSuplente);
            });

            // Si hay al menos 2 jugadores en el podio, iniciamos el juego del balón
            if(nodosPodio.length >= 2) {
                inicializarPasesBalon();
            }
        }

        // LÓGICA DE TRASLACIÓN Y REBOTE DEL BALÓN
        function inicializarPasesBalon() {
            pelotaElemento = document.createElement('div');
            pelotaElemento.classList.add('world-cup-ball');
            pelotaElemento.innerHTML = '<i class="fa-solid fa-soccer-ball"></i>';
            cancha.appendChild(pelotaElemento);

            indiceAvatarActual = 0; 
            let objetivo = obtenerSiguienteObjetivoAleatorio(indiceAvatarActual);

            // Coordenadas iniciales (Centro del primer avatar)
            let posCentroOrigen = calcularCentroRelativoCancha(nodosPodio[indiceAvatarActual]);
            let pelotaX = posCentroOrigen.x;
            let pelotaY = posCentroOrigen.y;

            // Rotación del ícono del balón
            let gradosRotacion = 0;

            // Configuración física del pase continuo
            const velocidadPixelPorFrame = 3.5; 

            jugadaInterval = setInterval(() => {
                if (!pelotaElemento || nodosPodio.length === 0) return;

                let posCentroDestino = calcularCentroRelativoCancha(nodosPodio[objetivo]);

                let diferenciaX = posCentroDestino.x - pelotaX;
                let diferenciaY = posCentroDestino.y - pelotaY;
                let distanciaTotal = Math.sqrt(diferenciaX * diferenciaX + diferenciaY * diferenciaY);

                if (distanciaTotal < velocidadPixelPorFrame) {
                    // Colisión / Choque detectado: El balón llega al avatar destino y rebota hacia otro aleatorio
                    indiceAvatarActual = objetivo;
                    objetivo = obtenerSiguienteObjetivoAleatorio(indiceAvatarActual);
                } else {
                    // Mover la pelota de forma lineal hacia el objetivo actual
                    pelotaX += (diferenciaX / distanciaTotal) * velocidadPixelPorFrame;
                    pelotaY += (diferenciaY / distanciaTotal) * velocidadPixelPorFrame;
                }

                gradosRotacion = (gradosRotacion + 8) % 360;

                // Renderizar la posición en la cancha restando la mitad de las dimensiones del balón (12px) para centrarlo perfectamente
                pelotaElemento.style.left = `${pelotaX - 12}px`;
                pelotaElemento.style.top = `${pelotaY - 12}px`;
                pelotaElemento.style.transform = `rotate(${gradosRotacion}deg)`;

            }, 1000 / 60); // 60 FPS estables
        }

        function obtenerSiguienteObjetivoAleatorio(indiceActual) {
            let indicesDisponibles = [];
            for (let i = 0; i < nodosPodio.length; i++) {
                if (i !== indiceActual) indicesDisponibles.push(i);
            }
            // Retorna un índice al azar de los avatares restantes del podio
            return indicesDisponibles[Math.floor(Math.random() * indicesDisponibles.length)];
        }

        function calcularCentroRelativoCancha(nodoJugador) {
            const rectCancha = cancha.getBoundingClientRect();
            // Localizamos el contenedor del Avatar circular de manera específica
            const elementoAvatar = nodoJugador.querySelector('.avatar');
            const rectAvatar = elementoAvatar.getBoundingClientRect();

            // Obtenemos las coordenadas del centro del círculo del avatar restando la posición de la cancha
            return {
                x: (rectAvatar.left + rectAvatar.width / 2) - rectCancha.left,
                y: (rectAvatar.top + rectAvatar.height / 2) - rectCancha.top
            };
        }

        // Si el usuario cambia el tamaño de la ventana (Resize), recalculamos el render del juego para evitar descalces del balón
        window.addEventListener('resize', () => {
            if(nodosPodio.length >= 2 && pelotaElemento) {
                let posCentroActual = calcularCentroRelativoCancha(nodosPodio[indiceAvatarActual]);
                pelotaElemento.style.left = `${posCentroActual.x - 12}px`;
                pelotaElemento.style.top = `${posCentroActual.y - 12}px`;
            }
        });
    </script>
</body>
