<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copa Mundial FIFA 2026 - Estadio Virtual Interactivo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Paleta de Colores Oficial FIFA World Cup 2026 */
            --fifa-dark-bg: #0b0e14;
            --fifa-pitch-dark: #004d3c;
            --fifa-pitch-light: #00664f;
            --fifa-lime: #ccff00;
            --fifa-purple: #4a154b;
            --fifa-coral: #ff4a5a;
            
            --bg-gradient: linear-gradient(135deg, #0b0e14 0%, #161c27 100%);
            --panel-bg: rgba(18, 24, 38, 0.75);
            --panel-border: rgba(204, 255, 0, 0.15);
            
            --text-main: #ffffff;
            --text-muted: #94a3b8;

            --gold: #f59e0b;
            --silver: #cbd5e1;
            --bronze: #ea580c;
        }

        body {
            font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-gradient);
            background-color: var(--fifa-dark-bg);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -10%; left: -10%; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(204, 255, 0, 0.08) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1350px; 
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
            border: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .status-bar {
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 50px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--fifa-lime);
            border: 1px solid rgba(204, 255, 0, 0.3);
            display: inline-block;
            align-self: center;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .header-titles {
            text-align: center;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0 0 5px 0;
            background: linear-gradient(to right, #ffffff, var(--fifa-lime), var(--fifa-coral));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .update-timestamp {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .workspace {
            display: flex;
            flex-direction: column; 
            gap: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        /* CANCHA */
        .football-pitch {
            width: 100%;
            aspect-ratio: 1 / 1.2; 
            background: 
                linear-gradient(rgba(11, 14, 20, 0.15) 0%, rgba(11, 14, 20, 0.55) 100%),
                repeating-linear-gradient(90deg, var(--fifa-pitch-dark), var(--fifa-pitch-dark) 6%, var(--fifa-pitch-light) 6%, var(--fifa-pitch-light) 12%);
            border-radius: 16px;
            border: 2.5px solid rgba(255, 255, 255, 0.9);
            position: relative;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.85), 0 15px 35px rgba(0,0,0,0.6);
            overflow: hidden;
            display: none;
            box-sizing: border-box;
        }

        .pitch-lines {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none;
        }
        .pitch-lines::before {
            content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: rgba(255,255,255,0.5);
        }
        .pitch-lines::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 20%; aspect-ratio: 1 / 1;
            border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; transform: translate(-50%, -50%);
        }

        .pitch-area-top, .pitch-area-bot {
            position: absolute; left: 50%; transform: translateX(-50%); width: 38%; height: 10%;
            border-left: 2px solid rgba(255,255,255,0.4); border-right: 2px solid rgba(255,255,255,0.4);
        }
        .pitch-area-top { top: 0; border-bottom: 2px solid rgba(255,255,255,0.4); }
        .pitch-area-bot { bottom: 0; border-top: 2px solid rgba(255,255,255,0.4); }

        /* BALÓN INTERACTIVO */
        .world-cup-ball {
            position: absolute;
            width: 24px; height: 24px;
            background: #ffffff; color: #000000;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; z-index: 50; pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.9), 0 0 12px var(--fifa-lime);
            transition: transform 0.05s linear;
        }

        /* ANIMACIÓN FLOTACIÓN BASE JUGADOR */
        @keyframes flotacionBreathing {
            0% { transform: translate(-50%, -52%); }
            50% { transform: translate(-50%, -48%); }
            100% { transform: translate(-50%, -52%); }
        }

        .player-node {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 14%; 
            animation: flotacionBreathing 4s ease-in-out infinite;
        }

        /* CUERPO DEL AVATAR Y EXTREMIDADES */
        .avatar-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: #111622;
            border: 2px solid var(--fifa-lime);
            box-shadow: 0 6px 14px rgba(0,0,0,0.6);
            position: relative;
            color: #fff;
            overflow: hidden;
            font-size: 4.5vw; 
            z-index: 2;
        }

        .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* CONTENEDORES DE EXTREMIDADES */
        .arms-wrapper, .feet-wrapper {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none;
        }

        /* BRACITOS Y MANOS EXTRA */
        .arms-wrapper::before, .arms-wrapper::after {
            content: '';
            position: absolute;
            top: 35%;
            width: 14%;
            height: 35%;
            background: #ffffff;
            border-radius: 20px;
            z-index: 1;
            transform-origin: top center;
        }
        
        /* Mano izquierda en la punta del brazo */
        .arms-wrapper::before {
            left: -12%;
            animation: moverBrazoIzq 0.6s ease-in-out infinite alternate;
            box-shadow: inset 0 -6px 0 0 #ffdbb5, 0 3px 6px rgba(0,0,0,0.4); /* El color carne simula la manito circular al final */
        }
        /* Mano derecha en la punta del brazo */
        .arms-wrapper::after {
            right: -12%;
            animation: moverBrazoDer 0.6s ease-in-out infinite alternate;
            box-shadow: inset 0 -6px 0 0 #ffdbb5, 0 3px 6px rgba(0,0,0,0.4);
        }

        /* PIES (ZAPATITOS) */
        .feet-wrapper::before, .feet-wrapper::after {
            content: '';
            position: absolute;
            bottom: -10%;
            width: 24%;
            height: 16%;
            background: #000000;
            border: 1px solid var(--fifa-lime);
            border-radius: 8px 8px 4px 4px;
            z-index: 0;
        }
        .feet-wrapper::before {
            left: 18%;
            animation: patearPieIzq 0.5s ease-in-out infinite alternate;
        }
        .feet-wrapper::after {
            right: 18%;
            animation: patearPieDer 0.5s ease-in-out infinite alternate;
        }

        /* KEYFRAMES ANIMACIONES */
        @keyframes moverBrazoIzq {
            0% { transform: rotate(30deg) translateY(0px); }
            100% { transform: rotate(-20deg) translateY(-2px); }
        }
        @keyframes moverBrazoDer {
            0% { transform: rotate(-30deg) translateY(-2px); }
            100% { transform: rotate(20deg) translateY(0px); }
        }
        @keyframes patearPieIzq {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-5px); }
        }
        @keyframes patearPieDer {
            0% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }

        /* COLORES DE EXTREMIDADES POR CLASIFICACIÓN */
        .p-pos-1 .arms-wrapper::before, .p-pos-1 .arms-wrapper::after { background: var(--gold); }
        .p-pos-2 .arms-wrapper::before, .p-pos-2 .arms-wrapper::after { background: var(--silver); }
        .p-pos-3 .arms-wrapper::before, .p-pos-3 .arms-wrapper::after { background: var(--bronze); }
        .p-normal .arms-wrapper::before, .p-normal .arms-wrapper::after { background: #0055ff; }

        /* DETALLES DE INFORMACIÓN JUGADOR */
        .player-info {
            background: #090d14; padding: 4px 8px; border-radius: 6px; margin-top: 14px;
            font-size: 1.8vw; font-weight: 700; border: 1px solid rgba(255, 255, 255, 0.12);
            white-space: nowrap; box-shadow: 0 5px 12px rgba(0,0,0,0.7); text-align: center; color: #ffffff; width: fit-content;
        }
        .player-score { color: var(--fifa-lime); font-size: 0.9em; font-weight: 800; display: block; margin-top: 1px; }

        .p-pos-1 .avatar { background: linear-gradient(135deg, #fbbf24, #d97706); border-color: #ffe399; box-shadow: 0 0 18px rgba(251, 191, 36, 0.4); }
        .p-pos-2 .avatar { background: linear-gradient(135deg, #f1f5f9, #475569); border-color: #ffffff; box-shadow: 0 0 14px rgba(255,255,255,0.25); }
        .p-pos-3 .avatar { background: linear-gradient(135deg, #ea580c, #7c2d12); border-color: #ffccb3; box-shadow: 0 0 12px rgba(234, 88, 12, 0.3); }
        .p-normal .avatar { background: linear-gradient(135deg, #0055ff, #050b14); border-color: rgba(204, 255, 0, 0.7); }

        /* BANCA */
        .bench-section {
            width: 100%; background: rgba(13, 18, 28, 0.6); border-radius: 18px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); box-sizing: border-box; display: none;
        }
        .bench-title {
            font-size: 18px; font-weight: 800; color: #cbd5e1; text-transform: uppercase; margin-bottom: 15px;
            display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px;
        }
        .bench-title i { color: var(--fifa-coral); }
        .bench-vertical-list { display: grid; grid-template-columns: 1fr; gap: 12px; width: 100%; }
        .bench-player {
            background: rgba(26, 34, 50, 0.4); padding: 14px 16px; border-radius: 14px; display: flex; align-items: center; gap: 15px; border: 1px solid rgba(255,255,255,0.04); width: 100%; box-sizing: border-box;
        }
        .bench-avatar-frame {
            width: 48px; height: 48px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); overflow: hidden; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.3); flex-shrink: 0; font-size: 18px; 
        }
        .bench-avatar-frame img { width: 100%; height: 100%; object-fit: cover; }
        .bench-pos {
            background: rgba(0, 0, 0, 0.4); width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #cbd5e1; flex-shrink: 0;
        }
        .bench-info-container { display: flex; flex-direction: column; overflow: hidden; flex: 1; }
        .bench-info-name { color: #ffffff; font-weight: 700; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bench-score { color: var(--fifa-lime); font-weight: 800; font-size: 16px; margin-top: 2px; }
        .empty-state { padding: 40px; color: var(--text-muted); font-style: italic; text-align: center; width: 100%; }

        /* RESPONSIVO */
        @media (min-width: 650px) {
            body { padding: 20px; } .main-wrapper { padding: 25px; } h2 { font-size: 30px; }
            .bench-vertical-list { grid-template-columns: repeat(2, 1fr); gap: 14px; }
        }

        @media (min-width: 992px) {
            body { padding: 30px; } .main-wrapper { padding: 35px; } h2 { font-size: 36px; }
            .workspace { flex-direction: row; align-items: flex-start; justify-content: space-between; gap: 25px; }
            .football-pitch { display: block; flex: 0 0 58%; max-width: 730px; }
            .bench-section { display: block; flex: 0 0 40%; align-self: stretch; }
            .bench-vertical-list { grid-template-columns: 1fr; gap: 14px; }
            .avatar { font-size: 26px; }
            .avatar-container { width: 74px; height: 74px; }
            .p-pos-1 .avatar-container { width: 96px; height: 96px; } 
            .p-pos-2 .avatar-container { width: 88px; height: 88px; }
            .p-pos-3 .avatar-container { width: 82px; height: 82px; }
            .player-node { width: auto; }
            .player-info { font-size: 13px; min-width: 105px; padding: 4px 8px; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div id="status-bar" class="status-bar">
            <i class="fa-solid fa-satellite-dish fa-bounce"></i> Sincronizando cancha con Google Sheets...
        </div>

        <div class="header-titles">
            <h2>Mundial FIFA 2026</h2>
            <div id="fecha-actualizacion" class="update-timestamp"></div>
        </div>

        <div id="mensaje-inicio" class="empty-state">
            <i class="fa-solid fa-sync fa-spin" style="font-size: 36px; color: #ccff00; margin-bottom: 15px; display:block;"></i>
            Abriendo puertas del estadio virtual...
        </div>

        <div class="workspace">
            <div class="football-pitch" id="cancha">
                <div class="pitch-lines"></div>
                <div class="pitch-area-top"></div>
                <div class="pitch-area-bot"></div>
            </div>

            <div class="bench-section" id="banca-contenedor">
                <div class="bench-title"><i class="fa-solid fa-couch"></i> A la banca 😆</div>
                <div class="bench-vertical-list" id="banca-cuerpo"></div>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL_SHEETS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRaSkZcOTooQwbmjreBN7WVtD5_s_PEJ1N8DOp5s0unXosIbvTRXGimFjKjHAHybcJZllDjiq-_zi0Q/pub?output=csv";

        const cancha = document.getElementById('cancha');
        const bancaContenedor = document.getElementById('banca-contenedor');
        const bancaCuerpo = document.getElementById('banca-cuerpo');
        const mensajeInicio = document.getElementById('mensaje-inicio');
        const statusBar = document.getElementById('status-bar');
        const fechaActualizacion = document.getElementById('fecha-actualizacion');

        let pelotaElemento = null;
        let jugadaInterval = null;
        let todosLosNodosCancha = []; // Ahora guardamos TODOS los jugadores de la cancha
        let indiceAvatarActual = 0; 

        window.addEventListener('DOMContentLoaded', cargarDatosDesdeNube);

        function cargarDatosDesdeNube() {
            const urlConRompeCache = `${BASE_URL_SHEETS}&cachebuster=${new Date().getTime()}`;
            fetch(urlConRompeCache)
                .then(response => {
                    if (!response.ok) throw new Error("Fallo de red");
                    return response.text();
                })
                .then(csvTexto => {
                    procesarCSV(csvTexto);
                    statusBar.innerHTML = `<i class="fa-solid fa-circle-check"></i> Cancha completa jugando en vivo`;
                })
                .catch(error => {
                    statusBar.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> Error al conectar base de datos.`;
                    statusBar.style.color = "var(--fifa-coral)";
                });
        }

        function procesarCSV(texto) {
            const filasRaw = texto.split(/\r?\n/);
            const filas = filasRaw.map(f => f.split(','));
            if (filas.length < 2) return;

            const listaJugadores = [];
            let colLugar = 0, colNombre = 1, colPuntaje = 2, colFoto = -1;

            if(filas[0]) {
                filas[0].forEach((celda, idx) => {
                    const txt = String(celda).toLowerCase().trim();
                    if(txt.includes("lug") || txt.includes("pos")) colLugar = idx;
                    if(txt.includes("nom") || txt.includes("int")) colNombre = idx;
                    if(txt.includes("pun") || txt.includes("mar")) colPuntaje = idx;
                    if(txt.includes("fot") || txt.includes("url") || txt.includes("img")) colFoto = idx;
                });
            }

            for (let i = 1; i < filas.length; i++) {
                const fila = filas[i];
                if (!fila || fila.length < 2 || !fila[colNombre]) continue;
                const pRaw = fila[colPuntaje];
                const puntosNum = pRaw !== undefined ? parseFloat(pRaw) : 0;
                let urlFoto = colFoto !== -1 && fila[colFoto] ? fila[colFoto].replace(/^"|"$/g, '').trim() : "";

                listaJugadores.push({
                    posOriginal: parseInt(fila[colLugar]) || (listaJugadores.length + 1),
                    nombre: fila[colNombre].replace(/^"|"$/g, '').trim(),
                    puntos: puntosNum,
                    foto: urlFoto
                });
            }

            listaJugadores.sort((a, b) => b.puntos - a.puntos);
            let rangoConsecutivo = 1;
            listaJugadores.forEach((jugador, index) => {
                if (index > 0 && jugador.puntos < listaJugadores[index - 1].puntos) rangoConsecutivo++;
                jugador.posCalculada = rangoConsecutivo;
            });

            renderizarEstadioFijo(listaJugadores);
        }

        function obtenerContenidoAvatar(lugar) {
            if (lugar === 1) return "👑";
            if (lugar === 2) return "🥈";
            if (lugar === 3) return "🥉";
            return "⚽";
        }

        function renderizarEstadioFijo(jugadores) {
            if(jugadaInterval) clearInterval(jugadaInterval);
            if(pelotaElemento) pelotaElemento.remove();

            cancha.querySelectorAll('.player-node').forEach(el => el.remove());
            bancaCuerpo.innerHTML = "";
            mensajeInicio.style.display = "none";
            cancha.style.display = "block";
            bancaContenedor.style.display = "block";

            const titulares = jugadores.slice(0, 11);
            const suplentes = jugadores.slice(11);

            const mapaTactico = [
                { x: 50, y: 88 }, { x: 84, y: 74 }, { x: 61, y: 74 }, { x: 39, y: 74 }, { x: 16, y: 74 },
                { x: 76, y: 53 }, { x: 50, y: 53 }, { x: 24, y: 53 }, { x: 70, y: 30 }, { x: 30, y: 30 }, { x: 50, y: 14 }
            ];

            todosLosNodosCancha = []; // Reiniciamos la lista de jugadores de la cancha

            titulares.forEach((item, index) => {
                const coordenadas = mapaTactico[10 - index];
                if (!coordenadas) return;

                const divJugador = document.createElement('div');
                divJugador.classList.add('player-node');
                
                if (item.posCalculada === 1) divJugador.classList.add('p-pos-1');
                else if (item.posCalculada === 2) divJugador.classList.add('p-pos-2');
                else if (item.posCalculada === 3) divJugador.classList.add('p-pos-3');
                else divJugador.classList.add('p-normal');

                divJugador.style.left = `${coordenadas.x}%`;
                divJugador.style.top = `${coordenadas.y}%`;

                const randomDurationBrazo = (Math.random() * 0.3 + 0.4).toFixed(2);
                const randomDurationPie = (Math.random() * 0.2 + 0.3).toFixed(2);

                const avatarContenido = item.foto !== "" 
                    ? `<img src="${item.foto}" alt="${item.nombre}">` 
                    : obtenerContenidoAvatar(item.posCalculada);

                divJugador.innerHTML = `
                    <div class="avatar-container">
                        <div class="arms-wrapper"></div>
                        <div class="avatar">${avatarContenido}</div>
                        <div class="feet-wrapper"></div>
                    </div>
                    <div class="player-info">
                        <strong>${item.posCalculada}. ${item.nombre}</strong>
                        <span class="player-score">${item.puntos} PTS</span>
                    </div>
                `;

                const arms = divJugador.querySelector('.arms-wrapper');
                const feet = divJugador.querySelector('.feet-wrapper');
                arms.style.setProperty('animation-duration', `${randomDurationBrazo}s`);
                feet.style.setProperty('animation-duration', `${randomDurationPie}s`);
                
                cancha.appendChild(divJugador);
                todosLosNodosCancha.push(divJugador); // Guardamos todos los nodos de la cancha
            });

            suplentes.forEach(item => {
                const divSuplente = document.createElement('div');
                divSuplente.classList.add('bench-player');
                const avatarContenidoSuplente = item.foto !== "" ? `<img src="${item.foto}" alt="${item.nombre}">` : obtenerContenidoAvatar(item.posCalculada);
                divSuplente.innerHTML = `
                    <div class="bench-pos">${item.posCalculada}</div>
                    <div class="bench-avatar-frame">${avatarContenidoSuplente}</div>
                    <div class="bench-info-container">
                        <span class="bench-info-name">${item.nombre}</span>
                        <div class="bench-score">${item.puntos} pts</div>
                    </div>
                `;
                bancaCuerpo.appendChild(divSuplente);
            });

            if(todosLosNodosCancha.length >= 2) {
                inicializarPasesBalon();
            }
        }

        /* BALÓN INTERACTIVO PASANDO POR TODOS LOS JUGADORES DE LA CANCHA */
        function inicializarPasesBalon() {
            pelotaElemento = document.createElement('div');
            pelotaElemento.classList.add('world-cup-ball');
            pelotaElemento.innerHTML = '<i class="fa-solid fa-soccer-ball"></i>';
            cancha.appendChild(pelotaElemento);

            indiceAvatarActual = 0; 
            let objetivo = obtenerSiguienteObjetivoAleatorio(indiceAvatarActual);

            let posCentroOrigen = calcularCentroRelativoCancha(todosLosNodosCancha[indiceAvatarActual]);
            let pelotaX = posCentroOrigen.x;
            let pelotaY = posCentroOrigen.y;
            let gradosRotacion = 0;
            const velocidadPixelPorFrame = 3.5; 

            jugadaInterval = setInterval(() => {
                if (!pelotaElemento || todosLosNodosCancha.length === 0) return;

                let posCentroDestino = calcularCentroRelativoCancha(todosLosNodosCancha[objetivo]);
                let diferenciaX = posCentroDestino.x - pelotaX;
                let diferenciaY = posCentroDestino.y - pelotaY;
                let distanciaTotal = Math.sqrt(diferenciaX * diferenciaX + diferenciaY * diferenciaY);

                if (distanciaTotal < velocidadPixelPorFrame) {
                    indiceAvatarActual = objetivo;
                    objetivo = obtenerSiguienteObjetivoAleatorio(indiceAvatarActual);
                } else {
                    pelotaX += (diferenciaX / distanciaTotal) * velocidadPixelPorFrame;
                    pelotaY += (diferenciaY / distanciaTotal) * velocidadPixelPorFrame;
                }

                gradosRotacion = (gradosRotacion + 8) % 360;
                pelotaElemento.style.left = `${pelotaX - 12}px`;
                pelotaElemento.style.top = `${pelotaY - 12}px`;
                pelotaElemento.style.transform = `rotate(${gradosRotacion}deg)`;

            }, 1000 / 60);
        }

        function obtenerSiguienteObjetivoAleatorio(indiceActual) {
            let indicesDisponibles = [];
            for (let i = 0; i < todosLosNodosCancha.length; i++) {
                if (i !== indiceActual) indicesDisponibles.push(i);
            }
            return indicesDisponibles[Math.floor(Math.random() * indicesDisponibles.length)];
        }

        function calcularCentroRelativoCancha(nodoJugador) {
            const rectCancha = cancha.getBoundingClientRect();
            const elementoAvatar = nodoJugador.querySelector('.avatar');
            const rectAvatar = elementoAvatar.getBoundingClientRect();
            return {
                x: (rectAvatar.left + rectAvatar.width / 2) - rectCancha.left,
                y: (rectAvatar.top + rectAvatar.height / 2) - rectCancha.top
            };
        }

        window.addEventListener('resize', () => {
            if(todosLosNodosCancha.length >= 2 && pelotaElemento) {
                let posCentroActual = calcularCentroRelativoCancha(todosLosNodosCancha[indiceAvatarActual]);
                pelotaElemento.style.left = `${posCentroActual.x - 12}px`;
                pelotaElemento.style.top = `${posCentroActual.y - 12}px`;
            }
        });
    </script>
</body>
</html>
